<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KGU Patissier</title>
    
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            background-image: url('bg.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
            text-align: center; /* 모든 글자를 화면 가운데로 정렬 */
            font-family: 'Malgun Gothic', sans-serif; /* 글꼴 변경 */
        }
        h1 {
            color: #46FFFF; /* 제목 글자 색상을 파란색으로 변경 */
        }
        p {
            color: #ffffff; /* 본문 글자 색상을 흰색으로 변경 */
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 가로를 2칸으로 똑같이 나눔 */
            row-gap: 30px;
            column-gap: 16px;
            width: 90%; 
            max-width: 400px; /* 그리드의 최대 너비 제한 */
            margin: 50px auto; /* 중앙 정렬 및 위아래 여백 */
        }
        .button-grid button {
            padding: 15px; /* 버튼 안쪽 여백(크기) */
            font-size: 18px; /* 글자 크기 */
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.4); /* 반투명한 흰색 배경 */
            color: #ffffff; /* 글자 색상 */
            border: 2px solid #ffffff; /* 테두리 없앰 */
            border-radius: 15px; /* 모서리를 둥글게 */
            cursor: pointer; /* 마우스 올렸을 때 손가락 모양으로 변경 */
            transition: 0.1s; /* 애니메이션 속도 */
        }
        .button-grid button:hover {
            background-color: rgba(255, 255, 255, 0.6); /* 불투명한 흰색으로 변경 */
            transform: scale(1.04); /* 버튼이 살짝 커지는 효과 */
        }
        footer {
            position: absolute; /* 글자 흐름과 무관하게 위치를 강제로 지정 */
            bottom: 0; /* 화면의 맨 아래(바닥)에 딱 붙임 */
            width: 100%; /* 가로 길이를 화면 전체로 넓힘 */
            padding-bottom: 20px; /* 너무 바닥에 붙지 않게 살짝 띄워줌 */
            color: #ffffff;
        }
    </style>
</head>
<body>
    <header>
        <h1>KGU Patissier</h1>
    </header>
    <main>
        <p>경기 파티시엘 메인 홈페이지</p>
        <div class="button-grid">
            <button onclick="window.location.href='introduce.html'">소개</button>
            <button onclick="window.location.href='notice.html'">공지</button>
            <button onclick="window.location.href='meeting.html'">모임</button>
            <button onclick="window.location.href='money.html'">결제</button>
            <button onclick="window.location.href='recipe.html'">레시피</button>
            <button onclick="window.location.href='record.html'">기록</button>
        </div>
    </main>
    <footer>
        <p>Copyright © KGU Patissier. All rights reserved.</p>
    </footer>
</body>
</html>
